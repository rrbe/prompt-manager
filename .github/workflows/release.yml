name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate Tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Match Tag to Cargo Version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "${version}" || "${RELEASE_TAG}" != "v${version}" ]]; then
            echo "tag ${RELEASE_TAG} does not match Cargo version ${version}" >&2
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: apple-arm
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: apple-intel
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-intel
          - runner: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            platform: linux-arm
            cross: true
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-intel
            suffix: .exe
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows-arm
            suffix: .exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux Cross Compiler
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross
      - name: Build Natively
        if: ${{ !matrix.cross }}
        env:
          RUSTFLAGS: ${{ startsWith(matrix.platform, 'windows') && '-C target-feature=+crt-static' || '' }}
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Build Linux ARM64
        if: matrix.cross
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Verify Native Binary
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          version="$("target/${{ matrix.target }}/release/pm${{ matrix.suffix }}" --version)"
          test "${version}" = "pm ${RELEASE_TAG#v}"
      - name: Prepare Binary
        shell: bash
        run: |
          binary="pm-${RELEASE_TAG}-${{ matrix.platform }}${{ matrix.suffix }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/pm${{ matrix.suffix }}" "dist/${binary}"
      - name: Generate Checksum
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          binary = Path("dist/pm-${{ env.RELEASE_TAG }}-${{ matrix.platform }}${{ matrix.suffix }}")
          digest = hashlib.sha256(binary.read_bytes()).hexdigest()
          binary.with_name(binary.name + ".sha256").write_text(f"{digest}  {binary.name}\n", encoding="utf-8")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pm-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pm-*
          path: dist
          merge-multiple: true
      - name: Generate Release Notes from Commits
        shell: bash
        run: |
          previous_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          if [[ -n "${previous_tag}" ]]; then
            commit_range="${previous_tag}..${RELEASE_TAG}"
          else
            commit_range="${RELEASE_TAG}"
          fi

          {
            echo "## Changes"
            echo
            git log \
              --format="- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))" \
              "${commit_range}"
            if [[ -n "${previous_tag}" ]]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${RELEASE_TAG}"
            fi
          } > release-notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${RELEASE_TAG}" dist/* install.sh LICENSE --notes-file release-notes.md --verify-tag
