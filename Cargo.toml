[package]
name = "prompt-manager"
version = "0.1.0"
edition = "2024"
description = "A small, local, pipe-friendly prompt manager"
license = "MIT"

[[bin]]
name = "pm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.47", features = ["derive"] }
clap_complete = { version = "4.6.9", features = ["unstable-dynamic"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.34"
shell-words = "1.1.0"
similar = "3.2.0"
tempfile = "3.21.0"
thiserror = "2.0.16"
time = { version = "0.3.55", features = ["formatting"] }

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
