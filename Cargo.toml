[package]
name = "prompt-manager"
version = "0.7.0"
edition = "2024"
description = "A small, local, pipe-friendly prompt manager"
repository = "https://github.com/rrbe/prompt-manager"
license = "MIT"

[[bin]]
name = "pm"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = { version = "4.6.9", features = ["unstable-dynamic"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
self_update = { version = "1.2.0", default-features = false, features = ["checksums", "compression-tar-gz", "github", "rustls", "ureq"] }
shell-words = "1.1.1"
similar = "3.2.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["local-offset"] }
timeago = { version = "0.6.1", default-features = false }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
